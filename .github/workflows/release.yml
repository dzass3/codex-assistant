name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 0.11.9"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate version and changelog
        id: version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if ($env:VERSION.StartsWith("v")) {
            $env:VERSION = $env:VERSION.Substring(1)
          }
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use X.Y.Z without a v prefix."
          }
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $tauri = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($package.version -ne $env:VERSION -or $tauri.version -ne $env:VERSION) {
            throw "package.json and tauri.conf.json must both equal $env:VERSION."
          }
          if (-not (Select-String -LiteralPath CHANGELOG.md -Pattern "^## $([regex]::Escape($env:VERSION))(?:\s|$)" -Quiet)) {
            throw "CHANGELOG.md does not contain a ## $env:VERSION section."
          }
          "version=$env:VERSION" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run complete source gate
        run: npm run check

  build:
    name: Build ${{ matrix.arch }}
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS and MSI
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis,msi

      - name: Normalize release filenames and checksums
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          $out = New-Item -ItemType Directory -Force -Path release-artifacts
          $bundle = Join-Path "src-tauri/target" "$env:TARGET/release/bundle"
          $exe = @(Get-ChildItem -LiteralPath (Join-Path $bundle "nsis") -Filter *.exe -File -ErrorAction Stop)
          $msi = @(Get-ChildItem -LiteralPath (Join-Path $bundle "msi") -Filter *.msi -File -ErrorAction Stop)
          if ($exe.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected exactly one NSIS EXE and one MSI for $env:ARCH."
          }
          Copy-Item -LiteralPath $exe[0].FullName -Destination (Join-Path $out "Codex Assistant_$($env:VERSION)_$($env:ARCH)-setup.exe")
          Copy-Item -LiteralPath $msi[0].FullName -Destination (Join-Path $out "Codex Assistant_$($env:VERSION)_$($env:ARCH)_en-US.msi")
          Get-ChildItem -LiteralPath $out -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            "$hash  $($_.Name)" | Add-Content -LiteralPath (Join-Path $out "SHA256SUMS-$env:ARCH.txt")
          }

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: codex-assistant-${{ needs.validate.outputs.version }}-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: codex-assistant-${{ needs.validate.outputs.version }}-*
          merge-multiple: true
          path: release-artifacts

      - name: Create combined checksum file
        run: cat release-artifacts/SHA256SUMS-*.txt | sort -k2 > release-artifacts/SHA256SUMS.txt

      - name: Extract bilingual changelog section
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "([[:space:]]|$)" { inside=1; print; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          printf '\n> Unsigned build: Windows may show SmartScreen or “Unknown publisher.” Verify SHA-256 before installing.\n' >> "$RUNNER_TEMP/notes.md"

      - name: Refuse duplicate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            release-artifacts/*.exe \
            release-artifacts/*.msi \
            release-artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Codex Assistant $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
