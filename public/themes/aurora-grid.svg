<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Aurora Grid abstract theme</title>
  <desc id="desc">An original dark blue and teal aurora over a restrained perspective grid.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#18204b"/>
      <stop offset="1" stop-color="#0b4d5f"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="20%" r="72%">
      <stop offset="0" stop-color="#64e7ff" stop-opacity=".42"/>
      <stop offset=".38" stop-color="#7280ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8adfeb" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <path d="M0 390C220 300 330 488 552 376S880 240 1200 344V675H0Z" fill="#071522" fill-opacity=".7"/>
  <path d="M0 452C236 360 388 524 610 426S926 294 1200 388" fill="none" stroke="#64e7ff" stroke-opacity=".3" stroke-width="3"/>
  <path d="M0 240C210 140 350 316 584 212S930 96 1200 182" fill="none" stroke="#9b8dff" stroke-opacity=".28" stroke-width="58"/>
  <rect y="330" width="1200" height="345" fill="url(#grid)" transform="skewY(-8)" transform-origin="center"/>
</svg>
