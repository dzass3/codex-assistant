[package]
name = "codex-assistant"
version = "0.5.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "codex-assistant"
path = "src/main.rs"

[lib]
name = "codex_assistant_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Cargo's resolver separates build dependencies; keep ICU's matching writeable feature there too.
writeable = { version = "=0.6.2", features = ["alloc"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
indexmap = "=2.13.0"
# MSRV 1.82: time 0.3.45+ may resolve to edition-2024 time-core releases.
time = "=0.3.44"
# ICU 2.0 builds its locale display helpers with `writeable` allocation support.
writeable = { version = "=0.6.2", features = ["alloc"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# MSRV 1.82: constrain the plugin's `zbus = "5.9"` range before it selects newer TOML crates.
zbus = "=5.9.0"
# zbus macros accepts 3.x; 3.5 resolves to edition-2024 TOML crates.
proc-macro-crate = "=3.4.0"
[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"
toml = "0.8"
