[default]
description = "Allow the sanitized Codex Assistant command surface"
permissions = [
  "allow-get-monitor-snapshot",
  "allow-refresh-monitor",
  "allow-get-monitor-settings",
  "allow-set-codex-home",
  "allow-get-routing-snapshot",
  "allow-install-routing",
  "allow-restore-routing",
  "allow-request-codex-restart",
  "allow-begin-routing-preflight",
  "allow-set-root-routing-enabled",
  "allow-get-theme-snapshot",
  "allow-start-theme-session",
  "allow-apply-theme",
  "allow-restore-theme",
]

[[permission]]
identifier = "allow-get-monitor-snapshot"
description = "Read the latest sanitized monitor snapshot"
commands.allow = ["get_monitor_snapshot"]

[[permission]]
identifier = "allow-refresh-monitor"
description = "Refresh read-only Codex metadata sources"
commands.allow = ["refresh_monitor"]

[[permission]]
identifier = "allow-get-monitor-settings"
description = "Read masked monitor settings"
commands.allow = ["get_monitor_settings"]

[[permission]]
identifier = "allow-set-codex-home"
description = "Choose the local Codex metadata directory"
commands.allow = ["set_codex_home"]

[[permission]]
identifier = "allow-get-routing-snapshot"
description = "Read the sanitized Smart Routing status"
commands.allow = ["get_routing_snapshot"]

[[permission]]
identifier = "allow-install-routing"
description = "Install the owned Smart Routing configuration"
commands.allow = ["install_routing"]

[[permission]]
identifier = "allow-restore-routing"
description = "Restore the owned Smart Routing configuration"
commands.allow = ["restore_routing"]

[[permission]]
identifier = "allow-request-codex-restart"
description = "Request the verified one-time Codex restart"
commands.allow = ["request_codex_restart"]

[[permission]]
identifier = "allow-begin-routing-preflight"
description = "Begin native capability verification for one visible root task"
commands.allow = ["begin_routing_preflight"]

[[permission]]
identifier = "allow-set-root-routing-enabled"
description = "Enable or disable Smart Routing for one visible root task"
commands.allow = ["set_root_routing_enabled"]

[[permission]]
identifier = "allow-get-theme-snapshot"
description = "Read the rights-audited declarative theme catalog and current theme state"
commands.allow = ["get_theme_snapshot"]

[[permission]]
identifier = "allow-start-theme-session"
description = "Start one verified Codex theme control session"
commands.allow = ["start_theme_session"]

[[permission]]
identifier = "allow-apply-theme"
description = "Apply one bundled rights-audited theme by identifier"
commands.allow = ["apply_theme"]

[[permission]]
identifier = "allow-restore-theme"
description = "Remove Codex Assistant theme styles and restore the official appearance"
commands.allow = ["restore_theme"]
